<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1C1713" />
<title>Lamplight OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg:#1C1713; --surface:#26201A; --surface2:#332B22; --border:#3D3326;
  --gold:#F2A93B; --lavender:#C3AEDB; --sage:#9BC08C; --rose:#E3A6A6; --dust:#9AAFC9;
  --text:#F7F1E6; --muted:#A89A8C;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; padding:0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
}
button { font-family:inherit; font-size:inherit; color:inherit; border:none; background:none;
  cursor:pointer; text-align:inherit; padding:0; margin:0; -webkit-appearance:none; appearance:none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }
.serif { font-family: 'Fraunces', serif; }
.header { padding: 24px 16px 8px; }
.brand { color: var(--gold); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; margin:0; }
.tagline { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.main { padding: 0 16px 16px; display:flex; flex-direction:column; gap:16px; }
.muted { color: var(--muted); }
.text-xs { font-size: 12px; }
.text-sm { font-size: 14px; }
.text-xl { font-size: 20px; }
.card { background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
.card-gold { border-color: var(--gold); }
.row { display:flex; align-items:center; }
.col { display:flex; flex-direction:column; }
.between { justify-content: space-between; }
.gap1 { gap:4px; } .gap2 { gap:8px; } .gap3 { gap:12px; }
.col.gap2 { gap:8px; } .col.gap3 { gap:12px; }
.font-semibold { font-weight:600; }
.mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;}

.icon-btn { background:var(--surface); border-radius:999px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:16px; }

.orb-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; }
.orb { position:relative; width:128px; height:128px; }
.orb-glow { position:absolute; left:50%; top:50%; width:72%; height:72%; transform:translate(-50%,-50%); border-radius:50%; background:var(--gold); filter: blur(22px); transition: opacity .6s ease; }
.orb svg { transform: rotate(-90deg); }
.orb-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.orb-center .emoji { font-size: 26px; }
.orb-center .pct { font-size: 22px; font-weight:600; }

.section { border-radius:16px; overflow:hidden; background:var(--surface); border:1px solid var(--border); }
.section-head { width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px; }
.section-body { padding: 0 14px 14px; display:flex; flex-direction:column; gap:8px; }
.chev { transition: transform .2s ease; color: var(--muted); display:inline-block; }
.chev.collapsed { transform: rotate(-90deg); }

.task { width:100%; display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; border:1.5px solid transparent; }
.task.featured { border-color: var(--gold); box-shadow: 0 0 18px rgba(242,169,59,0.2); }
.checkbox { flex-shrink:0; width:20px; height:20px; border-radius:999px; border:2px solid; display:flex; align-items:center; justify-content:center; font-size:11px; }
.task-label { flex:1; min-width:0; }
.task-label .t { font-size:14px; font-weight:500; }
.task-label .time { font-size:11px; color:var(--muted); margin-top:2px; }
.done .t { color: var(--muted); text-decoration: line-through; }

.input, textarea, select {
  width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; outline:none;
}
textarea { resize:none; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance: textfield; }
input[type=date] { color-scheme: dark; }

.extra-row { display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; background:var(--surface2); }
.extra-row span.label { flex:1; font-size:14px; }
.extra-row.done span.label { color:var(--muted); text-decoration:line-through; }
.add-row { display:flex; gap:8px; }
.add-btn { background:var(--gold); border-radius:10px; width:40px; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:18px; font-weight:700; align-self:stretch; }
.icon-x { padding:6px; font-size:14px; color:var(--muted); }

.mini-orb { width:30px; height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
.mini-orb-inner { width:22px; height:22px; border-radius:999px; background:var(--surface); }
.week-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
.week-day { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; border-radius:12px; }
.week-day.active { background: var(--surface2); }

.progress { width:100%; height:8px; border-radius:999px; background:var(--surface2); overflow:hidden; }
.progress-fill { height:100%; border-radius:999px; transition: width .4s ease; }

.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:4px; }
.stat-card .emoji { font-size:18px; }
.stat-card .val { font-size:22px; font-weight:600; }

.bar-chart { display:flex; align-items:flex-end; gap:6px; height:160px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
.bar { width:100%; border-radius:6px 6px 0 0; background:var(--gold); min-height:2px; }
.bar-label { font-size:9px; color:var(--muted); }

.priority-card { display:flex; gap:12px; }
.priority-icon { flex-shrink:0; width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:16px; }

.chip { font-size:11px; border-radius:999px; padding:4px 10px; }

.nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; justify-content:space-around; padding:8px 0; background:var(--surface); border-top:1px solid var(--border); }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 16px; color:var(--muted); font-size:11px; }
.nav-item.active { color:var(--gold); }
.nav-item .emoji { font-size:18px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== THEME ===================== */
const COLORS = {
  bg:'#1C1713', surface:'#26201A', surface2:'#332B22', border:'#3D3326',
  gold:'#F2A93B', lavender:'#C3AEDB', sage:'#9BC08C', rose:'#E3A6A6', dust:'#9AAFC9',
  text:'#F7F1E6', muted:'#A89A8C',
};
const CATEGORY_META = {
  faith:{color:COLORS.lavender, emoji:'✨'},
  growth:{color:COLORS.sage, emoji:'📈'},
  light:{color:COLORS.gold, emoji:'💡'},
  identity:{color:COLORS.rose, emoji:'🎥'},
  rest:{color:COLORS.dust, emoji:'🌙'},
};
const SECTION_META = {
  morning:{label:'Morning Foundations', emoji:'🌅', color:COLORS.lavender},
  growth:{label:'Growth Engine', emoji:'📈', color:COLORS.sage},
  light:{label:'Light & Learning', emoji:'💡', color:COLORS.gold},
  evening:{label:'Evening Rhythm', emoji:'🌙', color:COLORS.dust},
};
const WEEKLY_TARGETS_META = {
  tiktokVideos:{label:'TikTok videos posted', emoji:'🎥', color:COLORS.rose},
  tiktokText:{label:'TikTok text posts', emoji:'✎', color:COLORS.rose},
  lightGalleryPosts:{label:'Light Gallery posts', emoji:'💡', color:COLORS.gold},
  sundayCalls:{label:'Calls made (Sunday)', emoji:'📞', color:COLORS.sage},
  leadsContacted:{label:'Leads texted / added', emoji:'💬', color:COLORS.sage},
};

/* ===================== DATE HELPERS ===================== */
function toISODate(d){ const yr=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return yr+'-'+mo+'-'+day; }
function todayISO(){ return toISODate(new Date()); }
function parseISO(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(dateStr,n){ const d=parseISO(dateStr); d.setDate(d.getDate()+n); return toISODate(d); }
function getMonday(dateStr){ const d=parseISO(dateStr); const day=d.getDay(); const diff = day===0?-6:1-day; d.setDate(d.getDate()+diff); return toISODate(d); }
function dayName(dateStr){ return parseISO(dateStr).toLocaleDateString('en-US',{weekday:'long'}); }
function shortDate(dateStr){ return parseISO(dateStr).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function mod(n,m){ return ((n%m)+m)%m; }
const ANCHOR_MONDAY='2026-06-15';
function getWeekNumber(dateStr){ const monday=getMonday(dateStr); const diff=Math.round((parseISO(monday).getTime()-parseISO(ANCHOR_MONDAY).getTime())/86400000); return Math.floor(diff/7); }
function getWeekRotation(wn){ return { biweeklyOn: mod(wn,2)===0, outreachWoman: mod(wn,4)===0, outreachMan: mod(wn,4)===2 }; }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== TASK DATA ===================== */
const M1={id:'meditate',label:'Meditate',time:'6:00–6:20am',category:'faith',section:'morning'};
const M2={id:'prayer-am',label:'Prayer & Word',time:'6:20–7:00am',category:'faith',section:'morning'};
const V1={id:'whatsapp-status',label:'Post WhatsApp status',time:'Visibility',category:'growth',section:'growth'};
const V2={id:'good-morning',label:'Good morning to clients',time:'Visibility',category:'growth',section:'growth'};
const G1={id:'growth-text',label:'Text & groom leads',time:'3–5 contacts',category:'growth',section:'growth'};
const G2={id:'ai-agent',label:'Build / train AI agent',time:'10–15 min',category:'growth',section:'growth'};
const L1={id:'reading',label:"Reading toward this week's book",time:'Commute / night',category:'light',section:'light'};
const L2={id:'body-meals',label:'3 intentional meals',time:'All day',category:'light',section:'light'};
const E1={id:'dinner',label:'Dinner',time:'7:00–8:00pm',category:'rest',section:'evening'};
const E2={id:'rest-social',label:'Rest / social time',time:'8:00–10:00pm',category:'rest',section:'evening'};
const E3={id:'wind-down',label:'Wind down, reduce screens',time:'10:00–11:00pm',category:'rest',section:'evening'};
const E4={id:'quiet-time',label:'Personal quiet time',time:'11:00–11:30pm',category:'faith',section:'evening'};
const E5={id:'prayer-pm',label:'Prayer & communion',time:'11:30pm–1:00am',category:'faith',section:'evening'};
const EVENING=[E1,E2,E3,E4,E5];
const TIKTOK_FILM={id:'tiktok-film',label:'Film TikTok video(s)',time:'7:00–7:15am · optional',category:'identity',section:'morning'};

function getTasksForDay(dayIndex, dateStr) {
  switch(dayIndex){
    case 1: return [M1,M2,TIKTOK_FILM,V1,V2,G1,G2,
      {id:'study',label:'Study: Sales',time:'30–45 min',category:'growth',section:'growth'},
      {id:'team-meeting',label:'Team meeting',time:'9:00–10:00am',category:'growth',section:'growth'},
      {id:'newsletter',label:'Send weekly newsletter',time:'',category:'growth',section:'growth'},
      {id:'affiliate-motivation',label:'Affiliate group: Monday motivation',time:'',category:'growth',section:'growth'},
      {id:'light-gallery',label:'Light Gallery touch',time:'30 min',category:'light',section:'light'},
      L1,L2,...EVENING];
    case 2: return [M1,M2,TIKTOK_FILM,V1,V2,G1,G2,
      {id:'study',label:'Study: Marketing & Psychology',time:'30–45 min',category:'growth',section:'growth'},
      {id:'office-content',label:'Optional: office content shoot',time:'',category:'growth',section:'growth'},
      {id:'light-gallery',label:'Light Gallery touch',time:'30 min',category:'light',section:'light'},
      L1,L2,...EVENING];
    case 3: return [M1,M2,V1,V2,G1,G2,
      {id:'study',label:'Study: Finance',time:'30–45 min',category:'growth',section:'growth'},
      {id:'meetings',label:'Meetings / inspections',time:'Scheduled today',category:'growth',section:'growth'},
      {id:'mentee-checkin',label:'Mentee check-in',time:'Weekly',category:'growth',section:'growth'},
      {id:'light-gallery',label:'Light Gallery BATCH',time:'3 hours',category:'light',section:'light'},
      L1,L2,...EVENING];
    case 4: return [M1,M2,V1,V2,G1,G2,
      {id:'study',label:'Study: Femininity',time:'30–45 min',category:'growth',section:'growth'},
      {id:'content-shoot',label:'Shoot real estate content',time:'5–7 pieces',category:'growth',section:'growth'},
      {id:'light-gallery',label:'Light Gallery touch',time:'30 min',category:'light',section:'light'},
      L1,L2,...EVENING];
    case 5: return [M1,M2,TIKTOK_FILM,V1,V2,G1,G2,
      {id:'study',label:'Study: Healing & Mindset',time:'30–45 min',category:'growth',section:'growth'},
      {id:'light-gallery',label:'Light Gallery touch',time:'30 min',category:'light',section:'light'},
      L1,L2,...EVENING];
    case 6: {
      const rot=getWeekRotation(getWeekNumber(dateStr));
      const tasks=[M1,M2,V1,V2,G1,G2,
        {id:'affiliate-lesson',label:'Affiliate group: weekly lesson + property share',time:'',category:'growth',section:'growth'}];
      if(rot.outreachWoman) tasks.push({id:'outreach-woman',label:'Reach out to an admired woman in your field',time:'Monthly rotation · this week',category:'growth',section:'growth'});
      if(rot.outreachMan) tasks.push({id:'outreach-man',label:'Reach out to an admired man in your field',time:'Monthly rotation · this week',category:'growth',section:'growth'});
      tasks.push({id:'light-gallery',label:'Light Gallery touch',time:'30 min',category:'light',section:'light'});
      if(rot.biweeklyOn) tasks.push({id:'biweekly-shop',label:"Mom's shop content shoot",time:'Biweekly · this week',category:'light',section:'light'});
      tasks.push(L1,L2);
      if(rot.biweeklyOn) tasks.push(
        {id:'biweekly-hobby',label:'Hobby time',time:'Biweekly · this week',category:'rest',section:'evening'},
        {id:'biweekly-solo',label:'Solo date',time:'Biweekly · this week',category:'rest',section:'evening'});
      tasks.push(...EVENING);
      return tasks;
    }
    default: {
      const rot=getWeekRotation(getWeekNumber(dateStr));
      const tasks=[M1,M2,V1,V2,G2,
        {id:'calling-block',label:'BIG CALLING BLOCK — call leads & past clients',time:'The harvest',category:'growth',section:'growth',featured:true}];
      if(rot.biweeklyOn) tasks.push({id:'mentor-checkin',label:'Mentor check-in',time:'Biweekly · this week',category:'faith',section:'growth'});
      tasks.push(
        {id:'content-queue',label:"Queue this week's TikTok (3 video + 2 text) + Light Gallery posts",time:'',category:'light',section:'light'},
        {id:'light-gallery',label:'Light Gallery touch',time:'30 min',category:'light',section:'light'},
        L1,L2,
        {id:'plan-week',label:'Plan next week — outfits, bag, goals check',time:'',category:'rest',section:'evening'},
        ...EVENING);
      return tasks;
    }
  }
}

/* ===================== APP DATA ===================== */
function getDefaultData(){ return { days:{}, weekly:{}, goals:{ carCurrent:0, carTarget:1500000, moveOutDate:'2026-09-15', dealsClosed:1, dealsTarget:5, weightCurrent:0, weightTarget:60 } }; }
function defaultWeekly(){ return { tiktokVideos:{current:0,target:3}, tiktokText:{current:0,target:2}, lightGalleryPosts:{current:0,target:2}, sundayCalls:{current:0,target:10}, leadsContacted:{current:0,target:15} }; }
function getWeeklyData(d,monday){ return d.weekly[monday] || defaultWeekly(); }
function computeDayStats(dateStr,d){
  const dayIndex=parseISO(dateStr).getDay();
  const tasks=getTasksForDay(dayIndex,dateStr);
  const dayData=(d.days&&d.days[dateStr])||{tasks:{},custom:[],journal:''};
  const custom=dayData.custom||[];
  const doneTasks=tasks.filter(t=>dayData.tasks&&dayData.tasks[t.id]).length;
  const doneCustom=custom.filter(c=>c.done).length;
  const total=tasks.length+custom.length;
  const done=doneTasks+doneCustom;
  const pct = total===0?0:Math.round((done/total)*100);
  return {tasks,dayData,total,done,pct};
}

/* ===================== STATE ===================== */
const STORAGE_KEY='lamplight-os-data';
function loadData(){
  try { const raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); } catch(e){}
  return getDefaultData();
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }

let data = loadData();
let activeTab='today';
let selectedDate=todayISO();
let collapsedSections={};
let importText='';

/* ===================== MUTATIONS ===================== */
function ensureDay(dateStr){ if(!data.days[dateStr]) data.days[dateStr]={tasks:{},custom:[],journal:''}; return data.days[dateStr]; }
function toggleTask(taskId){ const day=ensureDay(selectedDate); day.tasks[taskId]=!day.tasks[taskId]; saveData(); render(); }
function addCustomTask(){
  const input=document.getElementById('new-task-input');
  const text=(input&&input.value||'').trim();
  if(!text) return;
  const day=ensureDay(selectedDate);
  day.custom.push({id:'c-'+Date.now(), text, done:false});
  saveData(); render();
}
function toggleCustom(id){ const day=ensureDay(selectedDate); const c=day.custom.find(c=>c.id===id); if(c) c.done=!c.done; saveData(); render(); }
function deleteCustom(id){ const day=ensureDay(selectedDate); day.custom=day.custom.filter(c=>c.id!==id); saveData(); render(); }
function updateJournal(text){ const day=ensureDay(selectedDate); day.journal=text; saveData(); }
function changeDate(delta){ selectedDate=addDays(selectedDate,delta); render(); }
function toggleSection(sec){ collapsedSections[sec]=!collapsedSections[sec]; render(); }
function setTab(tab){ activeTab=tab; render(); }
function jumpToDay(d){ selectedDate=d; activeTab='today'; render(); }

function onWeeklyInput(monday,key,field,val){
  if(!data.weekly[monday]) data.weekly[monday]=defaultWeekly();
  data.weekly[monday][key][field]=Number(val)||0;
  saveData();
  const v=data.weekly[monday][key];
  const pct = v.target>0 ? Math.min(100, Math.round((v.current/v.target)*100)) : 0;
  const bar=document.getElementById('out-'+key+'-bar'); if(bar) bar.style.width=pct+'%';
  updateGoalScore(monday);
}
function updateGoalScore(monday){
  const weekly=getWeeklyData(data,monday);
  const pcts=Object.values(weekly).map(v=>v.target>0?Math.min(100,(v.current/v.target)*100):0);
  const score=Math.round(pcts.reduce((s,x)=>s+x,0)/pcts.length);
  const el=document.getElementById('goal-score-val'); if(el) el.textContent=score+'%';
}
function onCarInput(field,val){
  data.goals[field]=Number(val)||0;
  saveData();
  const g=data.goals;
  const pct=g.carTarget>0?Math.min(100,Math.round((g.carCurrent/g.carTarget)*100)):0;
  const bar=document.getElementById('car-bar'); if(bar) bar.style.width=pct+'%';
  const pctEl=document.getElementById('car-pct'); if(pctEl) pctEl.textContent=pct+'%';
}
function onMoveOutChange(val){
  data.goals.moveOutDate=val;
  saveData();
  const days=Math.ceil((parseISO(val).getTime()-parseISO(todayISO()).getTime())/86400000);
  const el=document.getElementById('moveout-days'); if(el) el.textContent = days>0?days+' days':'Time to go 🎉';
}
function adjustDeals(delta){
  data.goals.dealsClosed=Math.max(0,data.goals.dealsClosed+delta);
  saveData(); render();
}
function onWeightInput(val){
  data.goals.weightCurrent=Number(val)||0;
  saveData();
  const g=data.goals;
  const pct=g.weightTarget>0?Math.min(100,Math.round((g.weightCurrent/g.weightTarget)*100)):0;
  const bar=document.getElementById('weight-bar'); if(bar) bar.style.width=pct+'%';
}

/* ===================== BACKUP / RESTORE ===================== */
function copyBackup(){
  const text=JSON.stringify(data);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      const btn=document.getElementById('copy-btn'); if(btn) btn.textContent='✓ Copied!';
      setTimeout(()=>{ const b=document.getElementById('copy-btn'); if(b) b.textContent='📋 Copy data'; },2000);
    }).catch(()=>{ const ta=document.getElementById('backup-text'); if(ta){ ta.focus(); ta.select(); } });
  } else {
    const ta=document.getElementById('backup-text'); if(ta){ ta.focus(); ta.select(); }
  }
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='lamplight-os-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreFromText(){ applyRestoredData(importText); }
function restoreFromFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>applyRestoredData(e.target.result);
  reader.readAsText(file);
}
function applyRestoredData(jsonString){
  const status=document.getElementById('backup-status');
  try{
    const parsed=JSON.parse(jsonString);
    if(!parsed||typeof parsed!=='object') throw new Error('bad');
    const defaults=getDefaultData();
    data = {
      days: parsed.days&&typeof parsed.days==='object'?parsed.days:{},
      weekly: parsed.weekly&&typeof parsed.weekly==='object'?parsed.weekly:{},
      goals: Object.assign({}, defaults.goals, parsed.goals||{}),
    };
    importText='';
    saveData();
    render();
    const s=document.getElementById('backup-status');
    if(s){ s.textContent="Restored — everything's back."; s.style.color=COLORS.sage; }
  }catch(e){
    if(status){ status.textContent="That didn't look like valid backup data."; status.style.color=COLORS.rose; }
  }
}

/* ===================== RENDER: TODAY ===================== */
function renderTask(t,dayData){
  const meta=CATEGORY_META[t.category];
  const checked=!!(dayData.tasks&&dayData.tasks[t.id]);
  return `
    <button class="task ${checked?'done':''} ${t.featured?'featured':''}"
      style="background:${checked?meta.color+'22':COLORS.surface2};"
      onclick="toggleTask('${t.id}')">
      <span class="checkbox" style="border-color:${meta.color};background:${checked?meta.color:'transparent'};color:${COLORS.bg};">${checked?'✓':''}</span>
      <span class="task-label">
        <div class="t">${escapeHtml(t.label)}</div>
        ${t.time?`<div class="time">${escapeHtml(t.time)}</div>`:''}
      </span>
      <span>${meta.emoji}</span>
    </button>`;
}

function renderToday(){
  const stats=computeDayStats(selectedDate,data);
  const {tasks,dayData,total,done,pct}=stats;
  const isToday = selectedDate===todayISO();
  const sections=['morning','growth','light','evening'];

  const orbGlow = (0.12 + (pct/100)*0.5).toFixed(2);
  const radius=57; const circumference=2*Math.PI*radius;
  const offset=circumference - (pct/100)*circumference;

  let html = `
    <div class="row between">
      <button class="icon-btn" onclick="changeDate(-1)">‹</button>
      <div style="text-align:center;">
        <p class="serif text-xl font-semibold" style="margin:0;">${dayName(selectedDate)}</p>
        <p class="muted text-xs" style="margin:2px 0 0;">${shortDate(selectedDate)}${isToday?' · Today':''}</p>
      </div>
      <button class="icon-btn" onclick="changeDate(1)">›</button>
    </div>
    <div class="orb-wrap">
      <div class="orb">
        <div class="orb-glow" style="opacity:${orbGlow}"></div>
        <svg width="128" height="128">
          <circle cx="64" cy="64" r="${radius}" stroke="${COLORS.surface2}" stroke-width="9" fill="none"/>
          <circle cx="64" cy="64" r="${radius}" stroke="${COLORS.gold}" stroke-width="9" fill="none"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"
            style="transition: stroke-dashoffset .6s ease;"/>
        </svg>
        <div class="orb-center">
          <span class="emoji">💡</span>
          <span class="pct serif">${pct}%</span>
        </div>
      </div>
      <p class="muted text-xs" style="margin:0;">${done} of ${total} lit today</p>
    </div>
  `;

  sections.forEach(sec=>{
    const secTasks=tasks.filter(t=>t.section===sec);
    if(secTasks.length===0) return;
    const meta=SECTION_META[sec];
    const doneCount=secTasks.filter(t=>dayData.tasks&&dayData.tasks[t.id]).length;
    const collapsed=!!collapsedSections[sec];
    html += `
      <div class="section">
        <button class="section-head" onclick="toggleSection('${sec}')">
          <div class="row gap2"><span>${meta.emoji}</span><span class="serif font-semibold text-sm" style="color:${meta.color}">${meta.label}</span></div>
          <div class="row gap2"><span class="muted text-xs">${doneCount}/${secTasks.length}</span><span class="chev ${collapsed?'collapsed':''}">⌄</span></div>
        </button>
        ${collapsed?'':`<div class="section-body">${secTasks.map(t=>renderTask(t,dayData)).join('')}</div>`}
      </div>`;
  });

  const customs=dayData.custom||[];
  html += `
    <div class="card">
      <p class="serif font-semibold text-sm" style="margin:0 0 12px;">Today's Extras</p>
      <div class="col gap2" style="margin-bottom:12px;">
        ${customs.length===0?`<p class="muted text-xs" style="font-style:italic;margin:0;">Nothing extra yet — add what came up today.</p>`:
          customs.map(c=>`
            <div class="extra-row ${c.done?'done':''}">
              <button class="checkbox" style="border-color:${COLORS.gold};background:${c.done?COLORS.gold:'transparent'};color:${COLORS.bg};" onclick="toggleCustom('${c.id}')">${c.done?'✓':''}</button>
              <span class="label">${escapeHtml(c.text)}</span>
              <button class="icon-x" onclick="deleteCustom('${c.id}')">✕</button>
            </div>`).join('')}
      </div>
      <div class="add-row">
        <input class="input" id="new-task-input" placeholder="What came up today?" onkeydown="if(event.key==='Enter') addCustomTask()" />
        <button class="add-btn" onclick="addCustomTask()">+</button>
      </div>
    </div>`;

  html += `
    <div class="card">
      <div class="row gap2" style="margin-bottom:12px;"><span>✎</span><span class="serif font-semibold text-sm">Journal</span></div>
      <textarea class="input" rows="4" placeholder="How did today go?" oninput="updateJournal(this.value)">${escapeHtml(dayData.journal||'')}</textarea>
    </div>`;

  return html;
}

/* ===================== RENDER: WEEK ===================== */
function renderOutputRow(monday,key,meta,value){
  const pct = value.target>0?Math.min(100,Math.round((value.current/value.target)*100)):0;
  return `
    <div>
      <div class="row between" style="margin-bottom:6px;">
        <div class="row gap2"><span>${meta.emoji}</span><span class="text-sm">${meta.label}</span></div>
        <div class="row gap1">
          <input class="input" type="number" style="width:48px;text-align:center;padding:4px;" value="${value.current}"
            oninput="onWeeklyInput('${monday}','${key}','current',this.value)" />
          <span class="muted text-xs">/</span>
          <input class="input" type="number" style="width:48px;text-align:center;padding:4px;" value="${value.target}"
            oninput="onWeeklyInput('${monday}','${key}','target',this.value)" />
        </div>
      </div>
      <div class="progress"><div class="progress-fill" id="out-${key}-bar" style="width:${pct}%;background:${meta.color};"></div></div>
    </div>`;
}
function renderRotationCard(monday){
  const rot=getWeekRotation(getWeekNumber(monday));
  const items=[];
  if(rot.biweeklyOn) items.push('Hobby time','Solo date',"Mom's shop shoot",'Mentor check-in');
  if(rot.outreachWoman) items.push('Outreach: admired woman');
  if(rot.outreachMan) items.push('Outreach: admired man');
  return `
    <div class="card">
      <div class="row gap2" style="margin-bottom:8px;"><span>📅</span><span class="serif font-semibold text-sm">This Week's Rotation</span></div>
      ${items.length>0?`<div class="row" style="flex-wrap:wrap;gap:8px;">${items.map(i=>`<span class="chip" style="background:${COLORS.dust}22;color:${COLORS.dust}">${i}</span>`).join('')}</div>`
        : `<p class="muted text-xs" style="font-style:italic;margin:0;">A lighter week — no rotating extras. They'll resurface on schedule, automatically.</p>`}
      <p class="muted text-xs" style="margin:8px 0 0;">Rotates on its own — these show up on Sat/Sun when it's their week. Nothing to track.</p>
    </div>`;
}
function renderWeek(){
  const monday=getMonday(selectedDate);
  const weekDates=Array.from({length:7},(_,i)=>addDays(monday,i));
  const weekly=getWeeklyData(data,monday);
  const weekStats=weekDates.map(d=>computeDayStats(d,data));
  const avgPct=Math.round(weekStats.reduce((s,x)=>s+x.pct,0)/7);
  const goalPcts=Object.values(weekly).map(v=>v.target>0?Math.min(100,(v.current/v.target)*100):0);
  const goalScore=Math.round(goalPcts.reduce((s,x)=>s+x,0)/goalPcts.length);

  return `
    <div style="text-align:center;">
      <p class="serif text-xl font-semibold" style="margin:0;">Week of ${shortDate(monday)}</p>
    </div>
    <div class="grid-2">
      <div class="stat-card"><span class="emoji">☀️</span><span class="val serif">${avgPct}%</span><span class="muted text-xs">Daily tasks · lit, avg</span></div>
      <div class="stat-card"><span class="emoji">📈</span><span class="val serif" id="goal-score-val">${goalScore}%</span><span class="muted text-xs">Weekly goals · output targets</span></div>
    </div>
    <div class="week-grid">
      ${weekDates.map((d,i)=>{
        const stat=weekStats[i];
        const active=d===selectedDate;
        return `<button class="week-day ${active?'active':''}" onclick="jumpToDay('${d}')">
          <span class="muted text-xs">${dayName(d).slice(0,3)}</span>
          <span class="mini-orb" style="background:conic-gradient(${COLORS.gold} ${stat.pct*3.6}deg, ${COLORS.surface2} 0deg)"><span class="mini-orb-inner"></span></span>
          <span class="text-xs">${shortDate(d).split(' ')[1]}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="card col gap3">
      <p class="serif font-semibold text-sm" style="margin:0;">This Week's Output</p>
      ${Object.entries(WEEKLY_TARGETS_META).map(([key,meta])=>renderOutputRow(monday,key,meta,weekly[key])).join('')}
    </div>
    ${renderRotationCard(monday)}`;
}

/* ===================== RENDER: GROWTH ===================== */
function renderGrowth(){
  const today=todayISO();
  const currentMonday=getMonday(today);
  const weeks=[];
  for(let i=7;i>=0;i--){
    const m=addDays(currentMonday,-7*i);
    const weekDates=Array.from({length:7},(_,j)=>addDays(m,j));
    const pcts=weekDates.map(d=>computeDayStats(d,data).pct);
    const avg=Math.round(pcts.reduce((s,x)=>s+x,0)/7);
    weeks.push({week:shortDate(m),pct:avg});
  }
  let streak=0; let d=today;
  while(computeDayStats(d,data).pct>=70){ streak++; d=addDays(d,-1); }

  const maxBar=160;
  return `
    <div class="grid-2">
      <div class="stat-card"><span class="emoji">🔥</span><span class="val serif">${streak} ${streak===1?'day':'days'}</span><span class="muted text-xs">Current streak · ≥70% complete</span></div>
      <div class="stat-card"><span class="emoji">📊</span><span class="val serif">${weeks[weeks.length-1].pct}%</span><span class="muted text-xs">This week · lit so far</span></div>
    </div>
    <div class="card">
      <p class="serif font-semibold text-sm" style="margin:0 0 12px;">8-Week Trend</p>
      <div class="bar-chart">
        ${weeks.map(w=>{
          const h=Math.max(2,(w.pct/100)*maxBar);
          const opacity=(0.35+(w.pct/100)*0.65).toFixed(2);
          return `<div class="bar-col"><div class="bar" style="height:${h}px;opacity:${opacity};"></div><span class="bar-label">${w.week}</span></div>`;
        }).join('')}
      </div>
    </div>
    <p class="muted text-xs" style="text-align:center;padding:0 16px;">Every bar is a week of seeds — planted, watered, some already harvested. The trend matters more than any single day.</p>`;
}

/* ===================== RENDER: VISION ===================== */
function renderPriority(emoji,color,title,desc){
  return `<div class="card priority-card">
    <div class="priority-icon" style="background:${color}22;">${emoji}</div>
    <div>
      <p class="serif font-semibold text-sm" style="margin:0;">${title}</p>
      <p class="muted text-xs" style="margin:4px 0 0;">${desc}</p>
    </div>
  </div>`;
}
function renderBackupCard(){
  return `
    <div class="card col gap2">
      <div class="row gap2"><span>📋</span><span class="serif font-semibold text-sm">Backup & Restore</span></div>
      <p class="muted text-xs" style="margin:0;">Your data lives in this browser only. Back it up regularly — especially before switching phones or browsers, or clearing browsing data.</p>
      <div class="row gap2">
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;" onclick="copyBackup()" id="copy-btn">📋 Copy data</button>
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;" onclick="downloadBackup()">⬇ Download file</button>
      </div>
      <textarea class="input" rows="2" readonly id="backup-text" onfocus="this.select()">${escapeHtml(JSON.stringify(data))}</textarea>
      <div style="height:1px;background:${COLORS.border};margin:4px 0;"></div>
      <p class="muted text-xs" style="margin:0;">Restore: paste backup text below, or choose a backup file.</p>
      <textarea class="input" rows="2" placeholder="Paste backup data here..." oninput="importText=this.value"></textarea>
      <input type="file" id="restore-file" accept="application/json,.json,.txt" style="display:none" onchange="restoreFromFile(this.files[0])" />
      <div class="row gap2">
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;background:${COLORS.gold};color:${COLORS.bg};border-color:${COLORS.gold};" onclick="restoreFromText()">⬆ Restore pasted</button>
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;" onclick="document.getElementById('restore-file').click()">📁 Choose file</button>
      </div>
      <p class="text-xs" id="backup-status" style="margin:0;min-height:14px;"></p>
    </div>`;
}
function renderVision(){
  const g=data.goals;
  const carPct = g.carTarget>0?Math.min(100,Math.round((g.carCurrent/g.carTarget)*100)):0;
  const weightPct = g.weightTarget>0?Math.min(100,Math.round((g.weightCurrent/g.weightTarget)*100)):0;
  const daysToMoveOut = Math.ceil((parseISO(g.moveOutDate).getTime()-parseISO(todayISO()).getTime())/86400000);

  return `
    <div class="card card-gold">
      <div class="row gap2" style="margin-bottom:8px;"><span>✨</span><span class="serif font-semibold text-sm" style="color:${COLORS.gold};">Who You're Becoming</span></div>
      <p class="text-sm" style="line-height:1.6;margin:0;">A woman fully at rest in who God made her — identity settled in Christ, mind and emotions renewed, peace constant regardless of what the day brings. Because she's walked that renewal herself, she teaches it with authority — her TikTok becomes a place thousands return to for their own minds and hearts. Her AI board of directors runs quietly underneath the brokerage: leads followed up, content drafted, nothing falling through the cracks — while her affiliate army grows toward thousands, each one selling and learning from her. Light Gallery scales at the pace alignment allows, lit by the same intentionality she brings to her own life.</p>
      <p class="text-sm" style="line-height:1.6;margin:12px 0 0;">Free: emotionally, mentally, spiritually, physically. Strong, nourished, swimming, at 60kg. Out of her parents' house and into her own. Wealthy, independent, and — within three years — married to someone who loves her the way she's learned to love herself.</p>
    </div>

    <div class="col gap3">
      ${renderPriority('✨',COLORS.lavender,'Faith & Identity','TikTok ministry — 3 videos + 2 text posts weekly, teaching identity in Christ from lived experience.')}
      ${renderPriority('💡',COLORS.gold,'Light Gallery','Your baby. AI-powered content showing the beauty of intentional lighting — lamps, warmth, ambience.')}
      ${renderPriority('📈',COLORS.sage,'Real Estate','Your wealth engine. CEO: sales, marketing, scaling, closing — building an army of affiliates.')}
    </div>

    <div class="card col gap3">
      <p class="serif font-semibold text-sm" style="margin:0;">2026 Milestones</p>

      <div>
        <div class="row between" style="margin-bottom:6px;">
          <span class="text-sm">Car fund · target July</span>
          <span class="muted text-xs" id="car-pct">${carPct}%</span>
        </div>
        <div class="row gap2" style="margin-bottom:6px;">
          <span class="muted text-xs">₦</span>
          <input class="input" type="number" value="${g.carCurrent}" oninput="onCarInput('carCurrent',this.value)" />
          <span class="muted text-xs">of ₦</span>
          <input class="input" type="number" value="${g.carTarget}" oninput="onCarInput('carTarget',this.value)" />
        </div>
        <div class="progress"><div class="progress-fill" id="car-bar" style="width:${carPct}%;background:${COLORS.gold};"></div></div>
      </div>

      <div>
        <div class="row between" style="margin-bottom:6px;">
          <span class="text-sm">Move-out date</span>
          <span class="text-xs font-semibold" id="moveout-days" style="color:${COLORS.gold};">${daysToMoveOut>0?daysToMoveOut+' days':'Time to go 🎉'}</span>
        </div>
        <input class="input" type="date" value="${g.moveOutDate}" onchange="onMoveOutChange(this.value)" />
      </div>

      <div>
        <div class="row between" style="margin-bottom:6px;">
          <span class="text-sm">Deals closed this year</span>
          <span class="text-sm font-semibold" style="color:${COLORS.sage};">${g.dealsClosed} / ${g.dealsTarget}</span>
        </div>
        <div class="row gap2">
          <button class="icon-btn" style="width:auto;padding:4px 12px;border-radius:10px;font-weight:600;" onclick="adjustDeals(-1)">−</button>
          <div class="progress" style="flex:1;"><div class="progress-fill" style="width:${Math.min(100,(g.dealsClosed/g.dealsTarget)*100)}%;background:${COLORS.sage};"></div></div>
          <button class="icon-btn" style="width:auto;padding:4px 12px;border-radius:10px;font-weight:600;" onclick="adjustDeals(1)">+</button>
        </div>
      </div>

      <div>
        <div class="row between" style="margin-bottom:6px;">
          <span class="text-sm">Body — toward 60kg</span>
          <span class="muted text-xs">${g.weightCurrent||'—'} / ${g.weightTarget} kg</span>
        </div>
        <input class="input" type="number" placeholder="Current weight (kg)" value="${g.weightCurrent||''}" oninput="onWeightInput(this.value)" style="margin-bottom:6px;" />
        <div class="progress"><div class="progress-fill" id="weight-bar" style="width:${weightPct}%;background:${COLORS.rose};"></div></div>
      </div>
    </div>

    ${renderBackupCard()}`;
}

/* ===================== NAV + MAIN RENDER ===================== */
function renderNav(){
  const tabs=[['today','Today','☀️'],['week','Week','📅'],['growth','Growth','📊'],['vision','Vision','✨']];
  return `<div class="nav">${tabs.map(([id,label,emoji])=>`
    <button class="nav-item ${activeTab===id?'active':''}" onclick="setTab('${id}')">
      <span class="emoji">${emoji}</span><span>${label}</span>
    </button>`).join('')}</div>`;
}
function render(){
  const app=document.getElementById('app');
  let content='';
  if(activeTab==='today') content=renderToday();
  else if(activeTab==='week') content=renderWeek();
  else if(activeTab==='growth') content=renderGrowth();
  else content=renderVision();
  app.innerHTML = `
    <div class="header">
      <p class="brand serif">Lamplight OS</p>
      <p class="tagline">Plant. Water. Harvest. Repeat. · Saved on this device</p>
    </div>
    <div class="main">${content}</div>
    ${renderNav()}`;
}
render();
</script>
